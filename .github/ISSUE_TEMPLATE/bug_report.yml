name: Bug report
description: Report a reproducible problem in the simulator
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets or personal data.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 128, Chrome 127, Safari 18
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: Pixel 9 / Android 15, or Linux / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the mission, control mode, and input sequence when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
